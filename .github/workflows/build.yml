    # ================================================================
    #  编译内核
    #
    #  timeconst.bc 修复：
    #    1. 尝试从 kernel.org 下载真正的 timeconst.bc
    #    2. 下载失败则用 fallback（需要正确 bc 语法 + 通过 stdin 传 HZ）
    #    3. 验证时 echo 1000 | bc -q ...（bc 从 stdin 读 HZ）
    # ================================================================
    - name: Build kernel
      run: |
        cd linux2/linux-6.18
        if [ -f "arch/x86/boot/bzImage" ] && [ "${{ steps.kernel-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ 使用缓存的内核"
        else
          echo "🔨 编译内核（约30-45分钟）..."
          start_time=$(date +%s)
          CPU_CORES=$(nproc)
          echo "CPU核心数: $CPU_CORES"
          make clean || true
          echo "🔍 检查 kernel/time/timeconst.bc ..."
          if [ ! -s kernel/time/timeconst.bc ]; then
            echo "⚠️ timeconst.bc 缺失，尝试从 kernel.org 下载..."
            wget -q --timeout=20 \
              -O kernel/time/timeconst.bc \
              "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/plain/kernel/time/timeconst.bc?h=v6.18" 2>/dev/null || true
          fi
          if [ ! -s kernel/time/timeconst.bc ]; then
            echo "⚠️ 下载失败，创建 fallback timeconst.bc ..."
            printf '%s\n' \
              'scale=0' \
              'define gcd(a,b) {' \
              '  auto t' \
              '  while (b) { t=b; b=a%b; a=t }' \
              '  return a' \
              '}' \
              'define timeconst(hz) {' \
              '  print "/* Automatically generated - do not edit */\n"' \
              '  print "#ifndef KERNEL_TIMECONST_H\n"' \
              '  print "#define KERNEL_TIMECONST_H\n\n"' \
              '  print "#include <linux/param.h>\n"' \
              '  print "#include <linux/types.h>\n\n"' \
              '  print "#if HZ != ", hz, "\n"' \
              '  print "#error wrong HZ value!\n"' \
              '  print "#endif\n\n"' \
              '  print "#define HZ_TO_MSEC_MUL32\tU64_C(0x10624DD3)\n"' \
              '  print "#define HZ_TO_MSEC_ADJ32\tU64_C(0x0)\n"' \
              '  print "#define HZ_TO_MSEC_SHR32\t6\n"' \
              '  print "#define MSEC_TO_HZ_MUL32\tU64_C(0xA00000000)\n"' \
              '  print "#define MSEC_TO_HZ_ADJ32\tU64_C(0x0)\n"' \
              '  print "#define MSEC_TO_HZ_SHR32\t3\n"' \
              '  cd=gcd(hz,1000)' \
              '  print "#define HZ_TO_MSEC_NUM\t\t", 1000/cd, "\n"' \
              '  print "#define HZ_TO_MSEC_DEN\t\t", hz/cd, "\n"' \
              '  print "#define MSEC_TO_HZ_NUM\t\t", hz/cd, "\n"' \
              '  print "#define MSEC_TO_HZ_DEN\t\t", 1000/cd, "\n\n"' \
              '  print "#define HZ_TO_USEC_MUL32\tU64_C(0x10624DD3)\n"' \
              '  print "#define HZ_TO_USEC_ADJ32\tU64_C(0x0)\n"' \
              '  print "#define HZ_TO_USEC_SHR32\t6\n"' \
              '  cd=gcd(hz,1000000)' \
              '  print "#define HZ_TO_USEC_NUM\t\t", 1000000/cd, "\n"' \
              '  print "#define HZ_TO_USEC_DEN\t\t", hz/cd, "\n"' \
              '  cd=gcd(hz,1000000000)' \
              '  print "#define HZ_TO_NSEC_NUM\t\t", 1000000000/cd, "\n"' \
              '  print "#define HZ_TO_NSEC_DEN\t\t", hz/cd, "\n\n"' \
              '  print "#endif\n"' \
              '  halt' \
              '}' \
              'hz=read()' \
              'timeconst(hz)' > kernel/time/timeconst.bc
            echo "✅ fallback timeconst.bc 已创建"
          fi
          echo "--- timeconst.bc 验证 ---"
          echo 1000 | bc -q kernel/time/timeconst.bc | head -5
          echo "...(以上为前5行，验证通过)"
          echo "-------------------------"
          make -j"$CPU_CORES" ARCH=x86_64 bzImage 2>&1 | tee build.log
          make -j"$CPU_CORES" ARCH=x86_64 modules 2>&1 | tee -a build.log
          if [ ! -f "arch/x86/boot/bzImage" ]; then
            echo "❌ 内核编译失败！"
            tail -50 build.log
            exit 1
          fi
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "✅ 编译完成，耗时: $((duration / 60)) 分钟 $((duration % 60)) 秒"
        fi
        ls -lh arch/x86/boot/bzImage
